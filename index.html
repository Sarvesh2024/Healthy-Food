<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        header h1 {
            color: #333;
            font-size: 28px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
            width: 100%;
        }

        button:hover {
            background: #764ba2;
        }

        .employees-section {
            grid-column: 1 / -1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        table tr:hover {
            background: #f5f5f5;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 12px;
            width: auto;
        }

        .btn-delete {
            background: #e74c3c;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .btn-edit {
            background: #3498db;
        }

        .btn-edit:hover {
            background: #2980b9;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-box h3 {
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .stat-box .number {
            font-size: 32px;
            font-weight: bold;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 30px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #667eea;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            width: auto;
            padding: 0;
        }

        .close-btn:hover {
            color: #333;
        }

        .employee-details {
            display: grid;
            gap: 15px;
        }

        .detail-row {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 20px;
        }

        .detail-label {
            font-weight: 600;
            color: #667eea;
        }

        .detail-value {
            color: #333;
        }

        .btn-export {
            background: #27ae60;
        }

        .btn-export:hover {
            background: #229954;
        }

        .btn-dark-mode {
            background: #2c3e50;
            width: auto;
            padding: 10px 20px;
            margin-top: 10px;
        }

        .btn-dark-mode:hover {
            background: #34495e;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
        }

        body.dark-mode .card,
        body.dark-mode .modal-content {
            background: #2c3e50;
            color: #ecf0f1;
        }

        body.dark-mode .card h2 {
            color: #3498db;
        }

        body.dark-mode table th {
            background: #34495e;
        }

        body.dark-mode table td,
        body.dark-mode table tr:hover {
            color: #ecf0f1;
            background: #34495e;
        }

        body.dark-mode input,
        body.dark-mode select {
            background: #34495e;
            color: #ecf0f1;
            border-color: #555;
        }

        body.dark-mode label {
            color: #ecf0f1;
        }

        body.dark-mode header {
            background: #2c3e50;
            color: #ecf0f1;
        }

        body.dark-mode header h1 {
            color: #ecf0f1;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .detail-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>👥 Employee Management System</h1>
            <button class="btn-dark-mode" onclick="toggleDarkMode()">🌙 Dark Mode</button>
        </header>

        <div class="stats">
            <div class="stat-box">
                <h3>Total Employees</h3>
                <div class="number" id="totalEmployees">0</div>
            </div>
            <div class="stat-box">
                <h3>Active Departments</h3>
                <div class="number" id="totalDepts">0</div>
            </div>
            <div class="stat-box">
                <h3>Average Salary</h3>
                <div class="number" id="avgSalary">$0</div>
            </div>
        </div>

        <div class="content">
            <div class="card">
                <h2>➕ Add New Employee</h2>
                <form id="employeeForm">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="department">Department *</label>
                        <select id="department" required>
                            <option value="">Select Department</option>
                            <option value="Engineering">Engineering</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Sales">Sales</option>
                            <option value="HR">Human Resources</option>
                            <option value="Finance">Finance</option>
                            <option value="Operations">Operations</option>
                            <option value="Product">Product</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="position">Position *</label>
                        <input type="text" id="position" placeholder="Software Engineer" required>
                    </div>
                    <div class="form-group">
                        <label for="salary">Salary *</label>
                        <input type="number" id="salary" placeholder="50000" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="(123) 456-7890">
                    </div>
                    <div class="form-group">
                        <label for="startDate">Start Date *</label>
                        <input type="date" id="startDate" required>
                    </div>
                    <button type="submit">Add Employee</button>
                </form>
            </div>

            <div class="card">
                <h2>🔍 Search & Filter</h2>
                <div class="form-group">
                    <label for="searchInput">Search by Name or Email</label>
                    <input type="text" id="searchInput" placeholder="Search...">
                </div>
                <div class="form-group">
                    <label for="filterDept">Filter by Department</label>
                    <select id="filterDept">
                        <option value="">All Departments</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Sales">Sales</option>
                        <option value="HR">Human Resources</option>
                        <option value="Finance">Finance</option>
                        <option value="Operations">Operations</option>
                        <option value="Product">Product</option>
                    </select>
                </div>
                <button class="btn-export" onclick="exportToCSV()">📥 Export to CSV</button>
                <button onclick="resetFilters()">Reset Filters</button>
            </div>

            <div class="card employees-section">
                <h2>📋 Employee List</h2>
                <div id="employeeListContainer">
                    <div class="empty-message">No employees added yet. Add one using the form above!</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Employee Details Modal -->
    <div id="employeeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Employee Details</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="employee-details" id="modalDetails"></div>
        </div>
    </div>

    <script>
        // Employee management system
        let employees = JSON.parse(localStorage.getItem('employees')) || [];

        // DOM Elements
        const employeeForm = document.getElementById('employeeForm');
        const searchInput = document.getElementById('searchInput');
        const filterDept = document.getElementById('filterDept');
        const employeeModal = document.getElementById('employeeModal');

        // Event listeners
        employeeForm.addEventListener('submit', addEmployee);
        searchInput.addEventListener('input', filterEmployees);
        filterDept.addEventListener('change', filterEmployees);
        window.addEventListener('click', function(event) {
            if (event.target === employeeModal) {
                closeModal();
            }
        });

        // Dark mode toggle
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        }

        // Load dark mode preference
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }

        // Add new employee
        function addEmployee(e) {
            e.preventDefault();

            const newEmployee = {
                id: Date.now(),
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                department: document.getElementById('department').value,
                position: document.getElementById('position').value,
                salary: parseInt(document.getElementById('salary').value),
                phone: document.getElementById('phone').value || 'N/A',
                startDate: document.getElementById('startDate').value
            };

            employees.push(newEmployee);
            saveEmployees();
            employeeForm.reset();
            displayEmployees(employees);
            updateStats();
            alert('Employee added successfully!');
        }

        // Save to localStorage
        function saveEmployees() {
            localStorage.setItem('employees', JSON.stringify(employees));
        }

        // Display employees
        function displayEmployees(employeeList) {
            const container = document.getElementById('employeeListContainer');

            if (employeeList.length === 0) {
                container.innerHTML = '<div class="empty-message">No employees found.</div>';
                return;
            }

            let html = '<table><thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Position</th><th>Salary</th><th>Start Date</th><th>Actions</th></tr></thead><tbody>';

            employeeList.forEach(emp => {
                html += `
                    <tr>
                        <td>${emp.name}</td>
                        <td>${emp.email}</td>
                        <td>${emp.department}</td>
                        <td>${emp.position}</td>
                        <td>$${emp.salary.toLocaleString()}</td>
                        <td>${new Date(emp.startDate).toLocaleDateString()}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-small btn-edit" onclick="viewEmployee(${emp.id})">View</button>
                                <button class="btn-small btn-edit" onclick="editEmployee(${emp.id})">Edit</button>
                                <button class="btn-small btn-delete" onclick="deleteEmployee(${emp.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // View employee details in modal
        function viewEmployee(id) {
            const emp = employees.find(e => e.id === id);
            if (emp) {
                const yearsOfService = Math.floor((new Date() - new Date(emp.startDate)) / (1000 * 60 * 60 * 24 * 365));
                
                document.getElementById('modalDetails').innerHTML = `
                    <div class="detail-row">
                        <span class="detail-label">Name:</span>
                        <span class="detail-value">${emp.name}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Email:</span>
                        <span class="detail-value">${emp.email}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Phone:</span>
                        <span class="detail-value">${emp.phone}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Department:</span>
                        <span class="detail-value">${emp.department}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Position:</span>
                        <span class="detail-value">${emp.position}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Salary:</span>
                        <span class="detail-value">$${emp.salary.toLocaleString()}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Start Date:</span>
                        <span class="detail-value">${new Date(emp.startDate).toLocaleDateString()}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Years of Service:</span>
                        <span class="detail-value">${yearsOfService} ${yearsOfService === 1 ? 'year' : 'years'}</span>
                    </div>
                `;
                employeeModal.classList.add('show');
            }
        }

        // Close modal
        function closeModal() {
            employeeModal.classList.remove('show');
        }

        // Delete employee
        function deleteEmployee(id) {
            if (confirm('Are you sure you want to delete this employee?')) {
                employees = employees.filter(emp => emp.id !== id);
                saveEmployees();
                displayEmployees(employees);
                updateStats();
            }
        }

        // Edit employee
        function editEmployee(id) {
            const emp = employees.find(e => e.id === id);
            if (emp) {
                // Populate form with employee data
                document.getElementById('name').value = emp.name;
                document.getElementById('email').value = emp.email;
                document.getElementById('department').value = emp.department;
                document.getElementById('position').value = emp.position;
                document.getElementById('salary').value = emp.salary;
                document.getElementById('phone').value = emp.phone;
                document.getElementById('startDate').value = emp.startDate;

                // Delete old record and let user resubmit
                deleteEmployee(id);
                // Scroll to form
                document.getElementById('employeeForm').scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Filter employees
        function filterEmployees() {
            const searchTerm = searchInput.value.toLowerCase();
            const deptFilter = filterDept.value;

            const filtered = employees.filter(emp => {
                const matchesSearch = emp.name.toLowerCase().includes(searchTerm) || 
                                    emp.email.toLowerCase().includes(searchTerm);
                const matchesDept = !deptFilter || emp.department === deptFilter;
                return matchesSearch && matchesDept;
            });

            displayEmployees(filtered);
        }

        // Reset filters
        function resetFilters() {
            searchInput.value = '';
            filterDept.value = '';
            displayEmployees(employees);
        }

        // Export to CSV
        function exportToCSV() {
            if (employees.length === 0) {
                alert('No employees to export!');
                return;
            }

            let csv = 'Name,Email,Phone,Department,Position,Salary,Start Date\n';
            
            employees.forEach(emp => {
                csv += `"${emp.name}","${emp.email}","${emp.phone}","${emp.department}","${emp.position}",${emp.salary},"${emp.startDate}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `employees_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
            alert('Employees exported to CSV successfully!');
        }

        // Update statistics
        function updateStats() {
            document.getElementById('totalEmployees').textContent = employees.length;

            const departments = new Set(employees.map(e => e.department));
            document.getElementById('totalDepts').textContent = departments.size;

            const avgSalary = employees.length > 0
                ? Math.round(employees.reduce((sum, e) => sum + e.salary, 0) / employees.length)
                : 0;
            document.getElementById('avgSalary').textContent = '$' + avgSalary.toLocaleString();
        }

        // Initialize
        displayEmployees(employees);
        updateStats();
    </script>
</body>
</html>
